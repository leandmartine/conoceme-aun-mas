# CI activates fully after the Vite scaffold PR lands.
# For now this is a placeholder that validates the repo structure.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  docs-guard:
    name: Docs present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check foundation files
        run: |
          test -f docs/DESIGN.md
          test -f PROYECTO.md
          test -f AGENTS.md
          test -f CONTRIBUTING.md
          echo "Foundation docs OK"
