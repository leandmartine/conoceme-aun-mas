name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  docs-guard:
    name: Docs & content present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check foundation files
        run: |
          test -f docs/DESIGN.md
          test -f docs/ARCHITECTURE.md
          test -f docs/AI_GUIDE.md
          test -f docs/WORLD_MAP.md
          test -f PROYECTO.md
          test -f AGENTS.md
          test -f content/profile.json
          test -f content/places.index.json
          echo "Foundation docs + content OK"

  typecheck:
    name: Install, build, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck workspaces
        run: npm run typecheck
      - name: Build
        run: npm run build
