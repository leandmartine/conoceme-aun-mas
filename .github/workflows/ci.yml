name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  docs-guard:
    name: Docs & content present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check foundation files
        run: |
          test -f docs/DESIGN.md
          test -f docs/ARCHITECTURE.md
          test -f docs/AI_GUIDE.md
          test -f docs/WORLD_MAP.md
          test -f PROYECTO.md
          test -f AGENTS.md
          test -f content/profile.json
          test -f content/places.index.json
          test -f content/places/rambla.md
          echo "Foundation docs + content OK"
