name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  docs-guard:
    name: Docs & content present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check foundation files
        run: |
          test -f docs/DESIGN.md
          test -f docs/ARCHITECTURE.md
          test -f docs/AI_GUIDE.md
          test -f docs/WORLD_MAP.md
          test -f docs/DEPLOY.md
          test -f PROYECTO.md
          test -f AGENTS.md
          test -f content/profile.json
          test -f content/places.index.json
          test -d content/knowledge
          test -f content/knowledge/about.md
          test -f Dockerfile
          test -f docker-compose.yml
          echo "Foundation docs + content + deploy scaffold OK"

  typecheck-test-build:
    name: Install, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck workspaces
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build monorepo
        run: npm run build
