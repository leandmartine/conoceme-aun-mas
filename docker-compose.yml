# conoceme-aun-mas — self-host (NAS ZimaOS / Docker)
#
# Mac / PC (build local):
#   cp deploy/nas.env.example .env
#   docker compose up -d --build
#
# NAS ZimaBlade (recomendado — solo pull, sin compilar):
#   1. Copiá docker-compose.yml + .env al NAS
#   2. IMAGE=ghcr.io/leandmartine/conoceme-aun-mas:latest
#   3. docker compose pull && docker compose up -d
#
# LAN: http://IP_DEL_NAS:8787

services:
  web:
    image: ${IMAGE:-conoceme-aun-mas:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conoceme-aun-mas
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      CONTENT_ROOT: /app/content
      STATIC_ROOT: /app/apps/frontend/dist
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PORTFOLIO_API_KEYS: ${PORTFOLIO_API_KEYS:-}
      PUBLIC_COMPANION_KEY: ${PUBLIC_COMPANION_KEY:-dev-local-key}
      AI_RATE_LIMIT_MAX: ${AI_RATE_LIMIT_MAX:-30}
      AI_RATE_LIMIT_WINDOW_MS: ${AI_RATE_LIMIT_WINDOW_MS:-60000}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
